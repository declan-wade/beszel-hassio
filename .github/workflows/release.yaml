---
name: Release

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - "beszel-agent/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version and image
        id: app
        run: |
          echo "version=$(yq -r '.version' beszel-agent/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "image=$(yq -r '.image' beszel-agent/config.yaml)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./beszel-agent
          file: ./beszel-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.app.outputs.image }}:${{ steps.app.outputs.version }}
            ${{ steps.app.outputs.image }}:latest
          labels: |
            io.hass.type=addon
            io.hass.version=${{ steps.app.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BUILD_NAME=Beszel Agent
            BUILD_DESCRIPTION=Unofficial Home Assistant app for Beszel agent
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ steps.app.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            BUILD_REF=${{ github.sha }}
